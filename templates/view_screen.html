<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JVPS Desktop Remote — Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --bg: #09090b; --text: #ffffff; --accent: #007aff;
        }
        [data-theme="light"] {
            --glass: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(0, 0, 0, 0.1);
            --bg: #f4f4f7; --text: #1d1d1f;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, sans-serif; overflow: hidden;
            transition: background 0.3s ease;
        }

        .stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        #remoteVideo {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Glass Toolbar */
        .toolbar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; padding: 10px 15px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            z-index: 1000; transition: opacity 0.5s, transform 0.5s;
        }
        .toolbar.hidden { opacity: 0; transform: translateX(-50%) translateY(100px); pointer-events: none; }
        .toolbar.fullscreen-hidden { display: none; }

        .tool-btn { 
            background: none; border: none; color: var(--text); font-size: 1.2rem; 
            cursor: pointer; padding: 8px; border-radius: 10px; transition: background 0.2s;
        }
        .tool-btn:active { background: var(--glass-border); }

        /* Adjustable Mousepad */
        #mousePad {
            position: fixed; background: var(--glass);
            backdrop-filter: blur(30px); border: 2px solid var(--accent);
            border-radius: 20px; display: none; z-index: 2000;
            touch-action: none;
        }
        
        /* Desktop/Landscape Positioning */
        @media (min-width: 768px) or (orientation: landscape) {
            #mousePad {
                top: 50%; left: 50%; transform: translate(-50%, -50%);
                width: 60vw; height: 50vh;
            }
        }

        /* Mobile Portrait Positioning: Dock to Bottom */
        @media (max-width: 767px) and (orientation: portrait) {
            #mousePad {
                bottom: 90px; left: 5vw;
                width: 90vw; height: 35vh;
                transform: none;
            }
        }

        .pad-label { position: absolute; top: 10px; width: 100%; text-align: center; opacity: 0.5; font-size: 12px; pointer-events: none; }
        #kbdTrigger { position: absolute; opacity: 0; pointer-events: none; top: -100px; }
    </style>
</head>
<body id="mainBody">
    <input type="text" id="kbdTrigger" autocomplete="off" autofocus>
    
    <div class="stage">
        {% if session_id == 'SESSION-SERVER-1-DEPLOYED-SERVICES' %}
            <img id="remoteVideo" src="/stream/{{ session_id }}" alt="Desktop Stream" style="width: 100%; height: 100%; max-width: 100%; max-height: 100%; display: block; object-fit: contain; background: #000;" />
            <audio id="remoteAudio" autoplay src="/audio_stream/{{ session_id }}"></audio>
        {% else %}
            <video id="remoteVideo" autoplay playsinline></video>
        {% endif %}
        <div id="loadingIndicator" style="position: absolute; text-align: center; color: #999;">
            <div style="font-size: 14px;">⏳ Waiting for broadcast...</div>
        </div>
    </div>

    <div id="mousePad">
        <div class="pad-label">Touchpad Mode (Drag to move, Tap to click)</div>
        <button id="closePad" style="position:absolute; right:15px; top:10px; color:var(--text); background:none; border:none; font-size: 20px;">✕</button>
    </div>

    <nav class="toolbar" id="mainToolbar">
        <button class="tool-btn" id="btnToggleControl" title="Toggle Remote Control">🖱️</button>
        <button class="tool-btn" id="btnKbd" title="Keyboard">⌨️</button>
        <button class="tool-btn" id="btnPaste" title="Paste to Host">📋</button>
        <button class="tool-btn" id="btnCopy" title="Copy Host Clipboard">📥</button>
        <button class="tool-btn" id="btnMute" title="Audio">🔊</button>
        <button class="tool-btn" id="btnRotate" title="Rotate">🔄</button>
        <button class="tool-btn" id="btnFlip" title="Flip">↔️</button>
        <button class="tool-btn" id="btnTheme" title="Theme">🌓</button>
        <button class="tool-btn" id="btnLock" title="Lock Toolbar">🔓</button>
        <a href="{{ url_for('view_list') }}" class="tool-btn" style="color: #ff3b30;" title="Exit">✕</a>
    </nav>

    <script>
        window.SESSION_ID = "{{ session_id }}";
        window.HOST_WIDTH = {{ host_width or 1920 }};
        window.HOST_HEIGHT = {{ host_height or 1080 }};
        const video = document.getElementById('remoteVideo');
        const remoteAudio = document.getElementById('remoteAudio');
        const kbdTrigger = document.getElementById('kbdTrigger');
        const mousePad = document.getElementById('mousePad');
        const html = document.documentElement;
        const toolbar = document.getElementById('mainToolbar');

        // --- Device Detection ---
        function isPhoneUser() {
            const ua = navigator.userAgent;
            return /iPhone|iPad|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        }

        // --- Transformation Logic ---
        let rotation = 0;
        let isFlipped = false;
        let toolbarLocked = localStorage.getItem('toolbarLocked') === 'true';

        function updateTransform() {
            video.style.transform = `rotate(${rotation}deg) scaleX(${isFlipped ? -1 : 1})`;
        }

        document.getElementById('btnRotate').onclick = () => { rotation = (rotation + 90) % 360; updateTransform(); };
        document.getElementById('btnFlip').onclick = () => { isFlipped = !isFlipped; updateTransform(); };

        // --- Lock Button Logic ---
        const btnLock = document.getElementById('btnLock');
        if (toolbarLocked) {
            btnLock.innerText = '🔒';
            btnLock.classList.add('active');
        }
        
        btnLock.onclick = () => {
            toolbarLocked = !toolbarLocked;
            localStorage.setItem('toolbarLocked', toolbarLocked);
            btnLock.innerText = toolbarLocked ? '🔒' : '🔓';
            btnLock.classList.toggle('active');
        };

        // --- Keyboard Button Logic ---
        const btnKbd = document.getElementById('btnKbd');
        if (btnKbd) {
            btnKbd.style.background = 'rgba(52, 152, 219, 0.4)';
            btnKbd.title = 'Keyboard: ACTIVE';
            btnKbd.onclick = () => {
                if (typeof kbdEnabled !== 'undefined') {
                    kbdEnabled = !kbdEnabled;
                    btnKbd.style.background = kbdEnabled ? 'rgba(52, 152, 219, 0.4)' : '';
                    btnKbd.title = kbdEnabled ? 'Keyboard: ACTIVE' : 'Keyboard: OFF';
                    if (kbdEnabled) {
                        kbdTrigger.focus({ preventScroll: true });
                    }
                } else {
                    kbdTrigger.focus({ preventScroll: true });
                }
            };
        }

        // Keep keyboard focused when interacting with screen
        if (video) {
            video.addEventListener('pointerdown', () => {
                if (kbdTrigger && (typeof kbdEnabled === 'undefined' || kbdEnabled)) {
                    kbdTrigger.focus({ preventScroll: true });
                }
            });
        }

        // --- Theme Toggle Logic ---
        document.getElementById('btnTheme').onclick = () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        };

        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);

        // --- Clipboard Logic ---
        document.getElementById('btnPaste').onclick = async () => {
            let text = '';
            try {
                text = await navigator.clipboard.readText();
            } catch (e) {
                text = prompt('Paste text to send to host:');
            }
            if (text) {
                socket.emit('clipboard_set', { text: text });
                alert('Copied to host clipboard!');
            }
        };

        document.getElementById('btnCopy').onclick = () => {
            socket.emit('clipboard_get', {}, async (response) => {
                if (response && response.text) {
                    try {
                        await navigator.clipboard.writeText(response.text);
                        alert('Host clipboard copied to your device!');
                    } catch (e) {
                        prompt('Host clipboard content (Ctrl+C to copy):', response.text);
                    }
                } else {
                    alert('Host clipboard is empty.');
                }
            });
        };

        // --- Toggle Control Logic ---
        let controlEnabled = true;
        const btnToggleControl = document.getElementById('btnToggleControl');
        if (btnToggleControl) {
            btnToggleControl.style.background = 'rgba(52, 152, 219, 0.4)';
            btnToggleControl.title = 'Control: ACTIVE (Mouse & Keyboard enabled)';
            btnToggleControl.onclick = function() {
                controlEnabled = !controlEnabled;
                if (typeof mouseEnabled !== 'undefined') {
                    mouseEnabled = controlEnabled;
                }
                if (typeof kbdEnabled !== 'undefined') {
                    kbdEnabled = controlEnabled;
                }
                this.style.background = controlEnabled ? 'rgba(52, 152, 219, 0.4)' : '';
                this.title = controlEnabled ? 'Control: ACTIVE (Tap/click to interact)' : 'Control: VIEW ONLY';
                if (btnKbd) {
                    btnKbd.style.background = controlEnabled ? 'rgba(52, 152, 219, 0.4)' : '';
                    btnKbd.title = controlEnabled ? 'Keyboard: ACTIVE' : 'Keyboard: OFF';
                }
            };
        }

        // --- Audio Logic ---
        document.getElementById('btnMute').onclick = function() {
            if (remoteAudio) {
                remoteAudio.muted = !remoteAudio.muted;
                this.innerText = remoteAudio.muted ? '🔇' : '🔊';
            } else if (video && typeof video.muted !== 'undefined') {
                video.muted = !video.muted;
                this.innerText = video.muted ? '🔇' : '🔊';
            }
        };

        // --- Auto-hide Toolbar ---
        let hideT;
        const resetT = () => {
            if (toolbarLocked) return;
            toolbar.classList.remove('hidden');
            clearTimeout(hideT);
            hideT = setTimeout(() => {
                if (mousePad && mousePad.style.display !== 'block') {
                    toolbar.classList.add('hidden');
                }
            }, 3000);
        };
        document.addEventListener('mousemove', resetT);
        document.addEventListener('touchstart', resetT);
        resetT();

        // --- Stream Status Monitor ---
        if (video.tagName === 'IMG') {
            video.onload = () => {
                const loader = document.getElementById('loadingIndicator');
                if (loader) loader.style.display = 'none';
            };
            video.onerror = () => {
                const loader = document.getElementById('loadingIndicator');
                if (loader) loader.style.display = 'block';
                setTimeout(() => {
                    video.src = `/stream/{{ session_id }}?t=` + Date.now();
                }, 2000);
            };
        } else {
            video.addEventListener('play', () => {
                const loader = document.getElementById('loadingIndicator');
                if (loader) loader.style.display = 'none';
            });
            video.addEventListener('pause', () => {
                const loader = document.getElementById('loadingIndicator');
                if (loader) loader.style.display = 'block';
            });
        }
    </script>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/webrtc_viewer.js') }}"></script>
</body>
</html>
