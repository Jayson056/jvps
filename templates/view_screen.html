<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniStream Pro — Remote</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --bg: #09090b; --text: #ffffff; --accent: #007aff;
        }
        [data-theme="light"] {
            --glass: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(0, 0, 0, 0.1);
            --bg: #f4f4f7; --text: #1d1d1f;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, sans-serif; overflow: hidden;
            transition: background 0.3s ease;
        }

        .stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        #remoteVideo {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Glass Toolbar */
        .toolbar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; padding: 10px 15px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            z-index: 1000; transition: opacity 0.5s, transform 0.5s;
        }
        .toolbar.hidden { opacity: 0; transform: translateX(-50%) translateY(100px); pointer-events: none; }
        .toolbar.fullscreen-hidden { display: none; }

        .tool-btn { 
            background: none; border: none; color: var(--text); font-size: 1.2rem; 
            cursor: pointer; padding: 8px; border-radius: 10px; transition: background 0.2s;
        }
        .tool-btn:active { background: var(--glass-border); }

        /* Adjustable Mousepad */
        #mousePad {
            position: fixed; background: var(--glass);
            backdrop-filter: blur(30px); border: 2px solid var(--accent);
            border-radius: 20px; display: none; z-index: 2000;
            touch-action: none;
        }
        
        /* Desktop/Landscape Positioning */
        @media (min-width: 768px) or (orientation: landscape) {
            #mousePad {
                top: 50%; left: 50%; transform: translate(-50%, -50%);
                width: 60vw; height: 50vh;
            }
        }

        /* Mobile Portrait Positioning: Dock to Bottom */
        @media (max-width: 767px) and (orientation: portrait) {
            #mousePad {
                bottom: 90px; left: 5vw;
                width: 90vw; height: 35vh;
                transform: none;
            }
        }

        .pad-label { position: absolute; top: 10px; width: 100%; text-align: center; opacity: 0.5; font-size: 12px; pointer-events: none; }
        #kbdTrigger { position: absolute; opacity: 0; pointer-events: none; top: -100px; }
    </style>
</head>
<body id="mainBody">
    <input type="text" id="kbdTrigger" autocomplete="off" autofocus>
    
    <div class="stage">
        <video id="remoteVideo" autoplay muted playsinline></video>
        <div id="loadingIndicator" style="position: absolute; text-align: center; color: #999;">
            <div style="font-size: 14px;">⏳ Waiting for broadcast...</div>
        </div>
    </div>

    <div id="mousePad">
        <div class="pad-label">Touchpad Mode (Drag to move, Tap to click)</div>
        <button id="closePad" style="position:absolute; right:15px; top:10px; color:var(--text); background:none; border:none; font-size: 20px;">✕</button>
    </div>

    <nav class="toolbar" id="mainToolbar">
        <button class="tool-btn" id="btnPad" title="Touchpad">🖱️</button>
        <button class="tool-btn" id="btnKbd" title="Keyboard">⌨️</button>
        <button class="tool-btn" id="btnMute">🔊</button>
        <button class="tool-btn" id="btnRotate">🔄</button>
        <button class="tool-btn" id="btnFlip">↔️</button>
        <button class="tool-btn" id="btnTheme">🌓</button>
        <button class="tool-btn" id="btnLock" title="Lock Toolbar">🔓</button>
        <a href="{{ url_for('view_list') }}" class="tool-btn" style="color: #ff3b30;">✕</a>
    </nav>

    <script>
        window.SESSION_ID = "{{ session_id }}";
        const video = document.getElementById('remoteVideo');
        const kbdTrigger = document.getElementById('kbdTrigger');
        const mousePad = document.getElementById('mousePad');
        const html = document.documentElement;
        const toolbar = document.getElementById('mainToolbar');

        // --- Device Detection ---
        function isPhoneUser() {
            const ua = navigator.userAgent;
            return /iPhone|iPad|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        }

        // --- Transformation Logic ---
        let rotation = 0;
        let isFlipped = false;
        let toolbarLocked = localStorage.getItem('toolbarLocked') === 'true';

        function updateTransform() {
            video.style.transform = `rotate(${rotation}deg) scaleX(${isFlipped ? -1 : 1})`;
        }

        document.getElementById('btnRotate').onclick = () => { rotation = (rotation + 90) % 360; updateTransform(); };
        document.getElementById('btnFlip').onclick = () => { isFlipped = !isFlipped; updateTransform(); };

        // --- Lock Button Logic ---
        const btnLock = document.getElementById('btnLock');
        if (toolbarLocked) {
            btnLock.innerText = '🔒';
            btnLock.classList.add('active');
        }
        
        btnLock.onclick = () => {
            toolbarLocked = !toolbarLocked;
            localStorage.setItem('toolbarLocked', toolbarLocked);
            btnLock.innerText = toolbarLocked ? '🔒' : '🔓';
            btnLock.classList.toggle('active');
        };

        // --- Mobile Keyboard Logic ---
        document.getElementById('btnKbd').onclick = () => {
            kbdTrigger.focus();
            kbdTrigger.click(); // Extra trigger for some mobile browsers
        };

        // --- Mousepad Logic ---
        document.getElementById('btnPad').onclick = () => { mousePad.style.display = 'block'; };
        document.getElementById('closePad').onclick = () => { mousePad.style.display = 'none'; };

        // --- Theme Toggle Logic ---
        document.getElementById('btnTheme').onclick = () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        };

        // Initialize theme from local storage
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);

        // --- Audio Logic ---
        document.getElementById('btnMute').onclick = function() {
            video.muted = !video.muted;
            this.innerText = video.muted ? '🔇' : '🔊';
        };

        // --- Auto-hide Toolbar ---
        let hideT;
        const resetT = () => {
            if (toolbarLocked) return; // Don't hide if locked
            toolbar.classList.remove('hidden');
            clearTimeout(hideT);
            hideT = setTimeout(() => {
                // Don't hide if mousepad is open
                if (mousePad.style.display !== 'block') {
                    toolbar.classList.add('hidden');
                }
            }, 3000);
        };
        document.addEventListener('mousemove', resetT);
        document.addEventListener('touchstart', resetT);
        resetT();

        // --- AUTO-FULLSCREEN ON LANDSCAPE (Phone Only) ---
        function handleOrientationChange() {
            if (!isPhoneUser()) return; // Only for phone users
            
            const isLandscape = window.innerHeight < window.innerWidth;
            console.log('Orientation:', isLandscape ? 'Landscape' : 'Portrait');
            
            if (isLandscape) {
                // LANDSCAPE: Enter fullscreen and hide toolbar
                if (!document.fullscreenElement) {
                    const stage = document.querySelector('.stage');
                    if (stage && stage.requestFullscreen) {
                        stage.requestFullscreen().catch(err => console.log('Fullscreen failed:', err));
                    } else if (stage && stage.webkitRequestFullscreen) {
                        stage.webkitRequestFullscreen();
                    }
                }
                toolbar.classList.add('fullscreen-hidden');
            } else {
                // PORTRAIT: Exit fullscreen and show toolbar
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(err => console.log('Exit fullscreen failed:', err));
                } else if (document.webkitFullscreenElement) {
                    document.webkitExitFullscreen();
                }
                // Always show toolbar in portrait
                toolbar.classList.remove('fullscreen-hidden');
                console.log('Toolbar should now be visible');
            }
        }

        window.addEventListener('orientationchange', handleOrientationChange);
        window.addEventListener('resize', handleOrientationChange);

        // --- Monitor video stream status ---
        video.addEventListener('play', () => {
            document.getElementById('loadingIndicator').style.display = 'none';
            console.log('[INFO] Video stream started playing');
        });
        video.addEventListener('pause', () => {
            document.getElementById('loadingIndicator').style.display = 'block';
            console.log('[INFO] Video stream paused');
        });
    </script>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/webrtc_viewer.js') }}"></script>
</body>
</html>
