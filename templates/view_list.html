<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>JVPS Desktop Remote — Available Sessions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --bg: #000000;
            --bg-secondary: #1c1c1e;
            --text: #ffffff;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --divider: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --bg-secondary: #f2f2f7;
            --text: #000000;
            --text-secondary: #6c6c70;
            --accent: #007aff;
            --divider: rgba(0, 0, 0, 0.1);
            --card-bg: rgba(0, 0, 0, 0.05);
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Safe Area Support */
        @supports (padding: max(0px)) {
            body {
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
                padding-left: max(0px, env(safe-area-inset-left));
                padding-right: max(0px, env(safe-area-inset-right));
            }
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--divider);
            flex-shrink: 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            animation: autoRefresh 3s linear infinite;
        }

        .refresh-btn:active {
            background: var(--accent);
            color: white;
        }

        @keyframes autoRefresh {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .refresh-status {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #4ADE80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px;
            -webkit-overflow-scrolling: touch;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }

        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 8px;
            padding: 0 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 13px;
        }

        .session-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 0 20px 0;
        }

        .session-item {
            background: var(--card-bg);
            border: 1px solid var(--divider);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .session-item:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.12);
        }

        .session-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .device-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .broadcaster-name {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .device-status {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            background: rgba(74, 222, 128, 0.2);
            color: #4ADE80;
            padding: 4px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        .viewer-count {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            padding: 4px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        .join-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .join-btn:active {
            opacity: 0.7;
            transform: scale(0.95);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            gap: 16px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 15px;
            text-align: center;
            max-width: 280px;
        }

        .footer {
            padding: 16px;
            border-top: 1px solid var(--divider);
            flex-shrink: 0;
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-home {
            background: var(--accent);
            color: white;
        }

        .btn-home:active {
            opacity: 0.7;
            transform: scale(0.98);
        }

        .btn-theme {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--divider);
        }

        .btn-theme:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header-title {
                font-size: 28px;
            }

            .header {
                padding: 16px 12px;
            }

            .content {
                padding: 0 12px;
            }

            .session-item {
                padding: 10px 12px;
            }

            .join-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        /* Landscape */
        @media (orientation: landscape) {
            .header {
                padding: 12px 16px;
            }

            .content {
                padding: 0 16px;
            }

            .section-title {
                margin-top: 12px;
                margin-bottom: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-content">
                <div class="header-title"><i class="fas fa-network-wired"></i> Active Devices</div>
                <button class="refresh-btn" id="refreshBtn" title="Refresh" onclick="manualRefresh()">🔄</button>
            </div>
            <div class="refresh-status">
                <div class="status-dot"></div>
                <span>Auto-refreshing</span>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content" id="contentArea">
            <div class="section-title">Available Broadcasters</div>
            <ul class="session-list" id="sessionList"></ul>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <a href="{{ url_for('home') }}" class="btn btn-home">← Home</a>
            <button class="btn btn-theme" id="themeBtn" onclick="toggleTheme()">🌓</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const html = document.documentElement;
        const sessionList = document.getElementById('sessionList');
        const refreshBtn = document.getElementById('refreshBtn');
        let autoRefreshInterval = null;
        let socket = null;

        // ===== THEME TOGGLE =====
        function toggleTheme() {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);

        // ===== FETCH BROADCASTERS =====
        async function fetchBroadcasters() {
            try {
                const response = await fetch('/api/broadcasters');
                const data = await response.json();
                renderSessions(data.broadcasters || []);
            } catch (error) {
                console.error('Error fetching broadcasters:', error);
                renderSessions([]);
            }
        }

        // ===== RENDER SESSIONS =====
        function renderSessions(broadcasters) {
            sessionList.innerHTML = '';

            if (!broadcasters || broadcasters.length === 0) {
                sessionList.innerHTML = `
                    <div class="empty-state" style="grid-column: 1; margin-top: 40px;">
                        <div class="empty-icon">📡</div>
                        <div class="empty-text">No active broadcasters</div>
                        <div class="empty-text" style="font-size: 12px; opacity: 0.6;">Waiting for connections...</div>
                    </div>
                `;
                return;
            }

            broadcasters.forEach((broadcaster) => {
                const li = document.createElement('li');
                li.className = 'session-item';
                
                // Get session ID for joining
                const sessionId = broadcaster.session_id || broadcaster;
                const roomName = broadcaster.room_name || `Broadcaster ${broadcaster}`;
                const broadcasterName = broadcaster.broadcaster_name || 'Anonymous';
                const viewerCount = broadcaster.viewer_count || 0;
                
                li.innerHTML = `
                    <div class="session-info">
                        <div class="device-name">📺 ${roomName}</div>
                        <div class="broadcaster-name">👤 ${broadcasterName}</div>
                        <div class="device-status">
                            <span class="online-badge">
                                <span style="width: 6px; height: 6px; background: #4ADE80; border-radius: 50%; display: inline-block;"></span>
                                Online
                            </span>
                            <span class="viewer-count">👥 ${viewerCount} viewer${viewerCount !== 1 ? 's' : ''}</span>
                        </div>
                    </div>
                    <button class="join-btn" onclick="joinSession('${sessionId}')">Join</button>
                `;
                sessionList.appendChild(li);
            });
        }

        // ===== JOIN SESSION =====
        function joinSession(sessionId) {
            // Redirect to password entry page instead of direct view
            window.location.href = `/view/${sessionId}/password`;
        }

        // ===== MANUAL REFRESH =====
        function manualRefresh() {
            refreshBtn.style.animation = 'none';
            setTimeout(() => {
                refreshBtn.style.animation = 'autoRefresh 3s linear infinite';
            }, 10);
            fetchBroadcasters();
        }

        // ===== AUTO-REFRESH SETUP =====
        function startAutoRefresh() {
            fetchBroadcasters();
            autoRefreshInterval = setInterval(fetchBroadcasters, 3000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // ===== PAGE VISIBILITY =====
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopAutoRefresh();
            } else {
                startAutoRefresh();
            }
        });

        // ===== SOCKET.IO REAL-TIME UPDATES =====
        try {
            socket = io();

            socket.on('connect', () => {
                console.log('Connected to server');
                fetchBroadcasters();
            });

            socket.on('broadcaster_joined', (data) => {
                console.log('Broadcaster joined:', data);
                fetchBroadcasters();
            });

            socket.on('broadcaster_left', (data) => {
                console.log('Broadcaster left:', data);
                fetchBroadcasters();
            });

            socket.on('update_broadcasters', (data) => {
                console.log('Broadcasters updated:', data);
                renderSessions(data.broadcasters || []);
            });
        } catch (error) {
            console.log('Socket.IO not available, using polling');
        }

        // ===== INITIALIZE =====
        window.addEventListener('load', () => {
            startAutoRefresh();
        });

        window.addEventListener('beforeunload', () => {
            stopAutoRefresh();
            if (socket) socket.disconnect();
        });
    </script>
</body>
</html>
